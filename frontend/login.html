<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="container">

    <form id="loginForm" class="card">

        <h2>Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

        <p>
            Don't have an account?
            <a href="register.html">
                Register
            </a>
        </p>

    </form>

</div>

<script src="js/login.js"></script>

</body>
</html>
