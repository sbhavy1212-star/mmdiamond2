<!DOCTYPE html>
<html>
<head>
    <title>Edit Diamond</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header>
    <h1>Edit Diamond</h1>
</header>

<div class="container">

    <form id="editForm" class="card">

        <input type="text" id="stockId" placeholder="Stock ID">
        <input type="text" id="shape" placeholder="Shape">
        <input type="number" id="carat" placeholder="Carat">
        <input type="text" id="color" placeholder="Color">
        <input type="text" id="purity" placeholder="Purity">
        <input type="text" id="cut" placeholder="Cut">
        <input type="text" id="lab" placeholder="Lab">
        <input type="number" id="totalPrice" placeholder="Total Price">

        <button type="submit">
            Update Diamond
        </button>

    </form>

</div>

<script src="js/editDiamond.js"></script>

</body>
</html>
